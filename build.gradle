}

tasks.register('bumpMajor') {
    group = 'versioning'
    description = 'Bumps the major version in gradle.properties and documentation.'
    doLast {
        File propsFile = new File(projectRootDir, 'gradle.properties')
        String current = '1.0.0'
        if (propsFile.exists()) {
            def match = (propsFile.getText('UTF-8') =~ /(?m)^mod_version\s*=\s*(.+)$/)
            if (match.find()) current = match.group(1).trim()
        }
        String next = VersionManager.bumpVersionString(current, 'major')
        VersionManager.applyNewVersion(projectRootDir, next, VersionManager.calculateSourceHash(projectRootDir), targetArchivesName)
        println "[Version] Bumped major version: ${current} -> ${next}"
    }
}

tasks.register('bumpVersion') {
    group = 'versioning'
    description = 'Alias for bumpPatch.'
    dependsOn 'bumpPatch'
}

tasks.register('checkModChanges') {
    group = 'versioning'
    description = 'Checks if mod source files have changed since the last recorded version/hash.'
    doLast {
        String currentHash = VersionManager.calculateSourceHash(projectRootDir)
        File hashFile = new File(projectRootDir, '.last_source_hash')
        String lastHash = hashFile.exists() ? hashFile.getText('UTF-8').trim() : ''
        if (!currentHash.equals(lastHash)) {
            println "[ModStatus] CHANGED: Sources have changed since last version bump."
            println "  Previous hash: ${lastHash ?: '(none)'}"
            println "  Current hash:  ${currentHash}"
        } else {
            println "[ModStatus] UNCHANGED: No modifications since last version bump (hash: ${currentHash})."
        }
    }
}

